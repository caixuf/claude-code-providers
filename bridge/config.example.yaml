# LiteLLM Proxy Configuration for Claude Code
# Converts Claude Code Anthropic Messages API (/v1/messages) to OpenAI/OpenRouter APIs (/chat/completions)

model_list:
  # -------------------------------------------------------------
  # 1. CommandCode (cmdc) — DeepSeek v4.1 Flash & Space Bunny (Stealth 1M)
  # Get your token from ~/.commandcode/auth.json
  # -------------------------------------------------------------
  - model_name: cmdc-deepseek
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: YOUR_COMMANDCODE_AUTH_TOKEN
  - model_name: cmdc-deepseek-fast
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash-fast
      api_base: https://api.commandcode.ai/provider/v1
      api_key: YOUR_COMMANDCODE_AUTH_TOKEN
      extra_body:
        reasoning_effort: "off"  # Disables deep thinking loop for instant low-latency output
  - model_name: cmdc-deepseek-pro
    litellm_params:
      model: openai/deepseek/deepseek-v4-pro
      api_base: https://api.commandcode.ai/provider/v1
      api_key: YOUR_COMMANDCODE_AUTH_TOKEN

  # -------------------------------------------------------------
  # 2. Cline Pass (Subscription Token Plan)
  # NOTE: MUST use the 'cline-pass/' prefix to draw from your flat
  # monthly subscription rather than pay-as-you-go credits!
  # -------------------------------------------------------------
  - model_name: cline-deepseek
    litellm_params:
      model: openai/cline-pass/deepseek-v4.1-flash
      api_base: https://api.cline.bot/api/v1
      api_key: YOUR_CLINE_PASS_API_KEY

  # -------------------------------------------------------------
  # 3. OpenRouter (Optional)
  # -------------------------------------------------------------
  - model_name: openrouter-claude
    litellm_params:
      model: openrouter/anthropic/claude-3.7-sonnet
      api_key: YOUR_OPENROUTER_API_KEY

  # -------------------------------------------------------------
  # 4. GitHub Copilot — Official Claude 5.5 Family (Sonnet 5.5, Haiku 5.5, Opus 5.5)
  # Run 'ccp auth copilot' to authenticate via GitHub Device Code flow.
  # -------------------------------------------------------------
  - model_name: claude-sonnet-5.5
    litellm_params:
      model: github_copilot/claude-sonnet-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: 'claude-sonnet-5.5[1m]'
    litellm_params:
      model: github_copilot/claude-sonnet-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: claude-sonnet-5-5
    litellm_params:
      model: github_copilot/claude-sonnet-5.5
  - model_name: copilot-sonnet
    litellm_params:
      model: github_copilot/claude-sonnet-5.5

  - model_name: claude-haiku-5.5
    litellm_params:
      model: github_copilot/claude-haiku-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: 'claude-haiku-5.5[1m]'
    litellm_params:
      model: github_copilot/claude-haiku-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: claude-haiku-5-5
    litellm_params:
      model: github_copilot/claude-haiku-5.5
  - model_name: copilot-haiku
    litellm_params:
      model: github_copilot/claude-haiku-5.5

  - model_name: claude-opus-5.5
    litellm_params:
      model: github_copilot/claude-opus-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: 'claude-opus-5.5[1m]'
    litellm_params:
      model: github_copilot/claude-opus-5.5
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: claude-opus-5-5
    litellm_params:
      model: github_copilot/claude-opus-5.5
  - model_name: copilot-opus
    litellm_params:
      model: github_copilot/claude-opus-5.5

  # Claude 5 / Claude 4.x fallbacks
  - model_name: claude-sonnet-5
    litellm_params:
      model: github_copilot/claude-sonnet-5
  - model_name: claude-opus-5
    litellm_params:
      model: github_copilot/claude-opus-5
  - model_name: claude-haiku-4.5
    litellm_params:
      model: github_copilot/claude-haiku-4.5
  - model_name: claude-sonnet-4.5
    litellm_params:
      model: github_copilot/claude-sonnet-4.5
  - model_name: claude-opus-4.5
    litellm_params:
      model: github_copilot/claude-opus-4.5
  - model_name: copilot-gpt4o
    litellm_params:
      model: github_copilot/gpt-4o

  # -------------------------------------------------------------
  # 5. StepFun (Step Plan API)
  # -------------------------------------------------------------
  - model_name: step-5-preview
    litellm_params:
      model: anthropic/step-5-preview
      api_base: https://api.stepfun.com/step_plan
      api_key: YOUR_STEPFUN_API_KEY
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000
  - model_name: step-3.7-flash
    litellm_params:
      model: anthropic/step-3.7-flash
      api_base: https://api.stepfun.com/step_plan
      api_key: YOUR_STEPFUN_API_KEY
      model_info:
        max_input_tokens: 1000000
        max_output_tokens: 128000

  # -------------------------------------------------------------
  # Wildcard Fallback
  # -------------------------------------------------------------
  - model_name: "*"
    litellm_params:
      model: openai/deepseek/deepseek-v4.1-flash
      api_base: https://api.commandcode.ai/provider/v1
      api_key: YOUR_COMMANDCODE_AUTH_TOKEN

general_settings:
  master_key: sk-cmdc-litellm-local
