# registry/profiles.yaml — the ONLY hand-authored curation layer.
#
# Everything factual about a model (context window, output cap, vision) is
# auto-discovered into registry/models.yaml by bridge/discover_models.py and
# must NOT be duplicated here. This file only records *choices*:
#   - which discovered model each Claude Code tier maps to, per profile
#   - the short alias the user types (ccp <alias>, /model tier)
#
# `ccp render` joins this with registry/models.yaml to emit:
#   ~/.config/litellm/config.yaml   (model_list + model_info)
#   bridge/clamp_map.json           (model -> max_output for the proxy)
#   providers/<profile>.json.example (CLAUDE_CODE_MAX_CONTEXT_TOKENS, tiers)
#
# Model names below are the *registry* names (upstream ids). Use the exact
# string shown by `ccp models <provider>`.
#
# ── A profile is a PROVIDER, not one model ─────────────────────────────
# `ccp` lists one folder per profile; the provider's models are its contents:
#
#     cline/  deepseek/  minimax/  opendesign/  qianfan/  trae/
#
#     ccp                       # the folders, with how many models each holds
#     ccp trae                  # switch to trae's default + list its models
#     ccp trae deepseek-V4.1-Flash   # or: ccp trae/deepseek-V4.1-Flash
#
# One profile per *model* would make `ccp` a flat list of 50+ near-identical
# lines that says nothing about which models belong together — the folders are
# the unit. Model names are matched case-insensitively; the registry's spelling
# is what gets written to settings.json.

version: 1

# ── Provider entry points ──────────────────────────────────────────────
# An entry point = one Claude Code profile. `tiers` maps the four Claude Code
# slots to registry model names. `ctx_from` picks which tier's model defines
# CLAUDE_CODE_MAX_CONTEXT_TOKENS for the whole profile (Claude Code has one
# context number per session, so we advertise the slot the user starts on).
profiles:
  cline:
    provider: cline
    primary_tier: default
    tiers:
      default: {model: deepseek/deepseek-v4.1-flash}
      opus:    {model: deepseek/deepseek-v4.1-flash}
      fable:   {model: deepseek/deepseek-v4.1-flash}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash}


  # ── Native Anthropic-compatible endpoints (no bridge clamp needed) ──
  # These talk straight to the provider's /anthropic endpoint; they are
  # rendered into config.yaml too so `ccp models` can list them, but the
  # profile JSON points ANTHROPIC_BASE_URL directly (no 127.0.0.1:4000).
  # Models are auto-discovered (see registry/models.yaml).
  deepseek:
    provider: deepseek
    native: true
    primary_tier: default
    # One model on every tier. The official catalogue serves deepseek-flash
    # and deepseek-v4-pro; the Flash is the cheap one, and the tiers are not
    # a place to buy something expensive by accident.
    tiers:
      default: {model: deepseek-flash}
      opus:    {model: deepseek-flash}
      fable:   {model: deepseek-flash}
      sonnet:  {model: deepseek-flash}
      haiku:   {model: deepseek-flash}

  minimax:
    provider: minimax
    native: true
    primary_tier: default
    # Two models, because MiniMax's own Anthropic-compatibility docs support
    # exactly `MiniMax-M3.1-Flash` and `MiniMax-M3` on this endpoint; the M2
    # family the catalogue still lists is reached through the plain MiniMax API.
    #
    # Start on M3.1-Flash: it is the current Flash tier, 1M context, 512K
    # output, image/video input, and it always thinks with tunable depth
    # (`output_config.effort`, default `max`). M3 is the same window and cap
    # with thinking off unless asked for, which is what the fast slots want.
    tiers:
      default: {model: MiniMax-M3.1-Flash}
      opus:    {model: MiniMax-M3}
      fable:   {model: MiniMax-M3.1-Flash}
      sonnet:  {model: MiniMax-M3}
      haiku:   {model: MiniMax-M3}

  # ── OpenDesign (amr-link.open-design.ai) ──────────────────────────────
  # Anthropic-native aggregator, so `native: true` — no bridge, no rewrites,
  # the profile points straight at the endpoint. A cheap credit re-seller
  # ($8 buys ~$120 of list-price usage).
  #
  # Deliberately curated down to ONE model: every tier is deepseek-v4.1-flash,
  # so no Claude Code slot can drift onto a model this account was not meant to
  # spend on. It is 1048k-context, so the 1M window holds on every tier. Add a
  # rung here if that ever changes.
  opendesign:
    provider: opendesign
    native: true
    primary_tier: default
    tiers:
      # The DeepSeek Flash answers first: it starts faster, and it is what
      # the main loop and the subagent tiers want. Muse Spark is cheaper and
      # stronger per token, but it always thinks before it speaks — 511
      # reasoning tokens before its first visible word on a two-word reply,
      # 10.3s to first token — so it takes the opus tier, where the wait buys
      # something, and leaves the rest to the Flash.
      default: {model: deepseek-v4.1-flash}
      opus:    {model: deepseek-v4.1-flash}
      fable:   {model: deepseek-v4.1-flash}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: deepseek-v4.1-flash}

  # ── Baidu Qianfan (千帆) Token Plan, personal tier ─────────────────────
  # Standard OpenAI-compatible Chat Completions on a Token-Plan-specific
  # prefix, so this is a normal *bridged* provider: no adapter, no native
  # endpoint. No `ccp auth` step — the key lives in proxy.env.
  #
  # The plan only serves the GLM / DeepSeek families; discovery narrows the
  # 35-model catalogue down to the 9 ids this subscription can actually call
  # (the set was re-probed against the 2026-10-24 key, which adds
  # deepseek-v4.1-flash-1017, deepseek-v4-pro-0813 and glm-5.1 to the six the
  # previous key served).
  # deepseek-v4.1-flash takes the top tiers: 1.44M context and genuinely
  # multimodal (vision works on it), so it also backs image pasting.
  qianfan:
    provider: qianfan
    primary_tier: sonnet
    # One model on every tier: deepseek-v4.1-flash is the 1.44M-context one
    # and it reads images, so it backs image pasting as well as the text.
    tiers:
      default: {model: deepseek-v4.1-flash-1017}
      opus:    {model: deepseek-v4.1-flash-1017}
      fable:   {model: deepseek-v4.1-flash-1017}
      sonnet:  {model: deepseek-v4.1-flash-1017}
      haiku:   {model: deepseek-v4.1-flash-1017}


  # ── OpenCode Go (opencode.ai) ──────────────────────────────────────────
  # A flat $10/month subscription, not a per-token gateway — so it is kept
  # like MiniMax rather than narrowed to one family. DeepSeek V4.1 Flash
  # alone gets 34,670 requests per 5 hours and 69,330 per month, which is
  # the "near-unlimited cheap model" case: nothing about reaching for it can
  # run a balance down.
  #
  # `native: true`: the console also serves an Anthropic Messages surface at
  # /inference/go/anthropic/v1, and that is the one to use. The gateway
  # refuses a request without a conversation id, and the id it wants is the
  # header Claude Code already sends (`x-claude-code-session-id`) — talking
  # to the vendor directly lets the client's own headers arrive untouched.
  # Through LiteLLM that header would be dropped, and forwarding client
  # headers globally would push `anthropic-beta` at every gateway in the
  # fleet. The key lives in proxy.env; there is no `ccp auth` step.
  opencode:
    provider: opencode
    native: false
    primary_tier: default
    tiers:
      default: {model: deepseek-v4.1-flash}
      opus:    {model: muse-spark-1.3-contributor}
      fable:   {model: deepseek-v4.1-flash}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: beam-free}

  # ── Trae CLI (ByteDance enterprise coding agent) ──────────────────────
  # Also `native: true`: bridge/trae_bridge.py speaks the Anthropic Messages
  # API directly, so Claude Code talks to :4100 with no LiteLLM hop. The
  # endpoint is the local adapter, not Trae itself — the adapter replays Trae's
  # private `llm_raw_chat` RPC using the PAT TraeCLI already stores on disk.
  #
  # The default/sonnet tier is DeepSeek-V4.1-Flash, which is TEXT-ONLY: TraeCLI
  # substitutes "[image/png content is not supported by current model]" if an
  # image reaches it, so a pasted screenshot silently degrades. opus/fable stay
  # on vision-capable Doubao-Seed-2.1-pro for image work; glm-5.3 (the strongest
  # tool-caller on this subscription) is also text-only and is reached via the
  # `trae-glm` alias instead of holding a tier.
  # Names are registry names (Trae `config_name`), which is what the adapter
  # matches against the live catalogue.
  trae:
    provider: trae
    native: true
    primary_tier: sonnet
    # One model on every tier: DeepSeek-V4.1-Flash. The vision-capable
    # Doubao rung and the glm rungs are deliberately not held — a Claude
    # Code slot must not be able to drift onto a model this account was not
    # meant to spend on.
    tiers:
      default: {model: DeepSeek-V4.1-Flash}
      opus:    {model: DeepSeek-V4.1-Flash}
      fable:   {model: DeepSeek-V4.1-Flash}
      sonnet:  {model: DeepSeek-V4.1-Flash}
      haiku:   {model: DeepSeek-V4.1-Flash}

  # ── qpcmqam relay (ai.qpcmqam.cn) ─────────────────────────────────────
  # A personal OpenAI-compatible relay. Bridged, not native: it speaks Chat
  # Completions, so it renders through LiteLLM like cline and qianfan.
  #
  # Deliberately one model — gemini-4-argon — because that is the only id this
  # request asked for, and the relay also serves gemini-3.8-flash that was not
  # wanted. Every tier points at the same model for that reason.
  #
  # Facts came from Google's own model page, not from the relay's claims:
  # 1,048,576-token context shared across input/thinking/output, 65,536
  # default max output (long decode can go to 1M but that is not the sync
  # path), text+image+video+audio+PDF in, text out.
  #
  # Probed on 2026-10-31 before writing this: plain completion 200,
  # 140,037-token prompt 200 (40.7s), streaming 200. Image input returned
  # 400 "Unable to process input image" — so `vision: true` above is the
  # model's documented capability, NOT something this relay was seen doing.
  # The relay is the unverified half.
  qpcmqam:
    provider: qpcmqam
    primary_tier: sonnet
    tiers:
      default: {model: gemini-4-argon}
      opus:    {model: gemini-4-argon}
      fable:   {model: gemini-4-argon}
      sonnet:  {model: gemini-4-argon}
      haiku:   {model: gemini-4-argon}

# ── Short aliases exposed to LiteLLM (config.yaml model_name) ──────────
# These are the names Claude Code puts in ANTHROPIC_MODEL. The `[1m]` marker
# is appended automatically for models whose ctx >= 1000000 (the proxy strips
# it before forwarding). Add aliases here only when you want a friendly name;
# the profile tier model above already resolves via its registry name.
aliases:
  # ── DeepSeek only ────────────────────────────────────────────────────
  # Every alias below is a DeepSeek Flash. The picker has one rule now: a
  # model that costs by the token is only worth reaching when it is the
  # cheap one. A relay that bills per token and sells several families at
  # once makes that a money question, not a taste question — probing the
  # expensive rungs on an account with a small balance is how the balance
  # disappears (see bridge/ccp_probe.py's spend guard).
  #
  # The names keep the `<provider>-<exact model>` spelling, because
  # DeepSeek's versions are three different models and the picker should
  # never make you guess which one you are getting.
  #
  # No `ctx` here: the window is a discovered fact and it lives in
  # registry/models.yaml. An alias that also carried one would be a second
  # source of truth, and the two disagreed — this file said 1000000 where
  # the registry said 1048576, and 168000 where it said 1000000 — while
  # nothing read the alias copy at all.
  cline-deepseek-v4.1-flash:            {provider: cline, model: deepseek/deepseek-v4.1-flash}
  # Qianfan: bridged, so these resolve through LiteLLM like the cline alias.
  qianfan-deepseek-v4.1-flash:          {provider: qianfan, model: deepseek-v4.1-flash-1017}
  qianfan-deepseek-v4.1-flash-1017:     {provider: qianfan, model: deepseek-v4.1-flash-1017}
  # OpenDesign: hot-swap between the aggregator's rungs with `ccp -m`
  opendesign-deepseek-v4.1-flash:       {provider: opendesign, model: deepseek-v4.1-flash}
  opencode-deepseek-v4.1-flash:        {provider: opencode, model: deepseek-v4.1-flash}

  # ── OpenCode Go's other two ───────────────────────────────────────────
  # Both are inside the subscription, so neither can run a balance down.
  # Muse Spark is the cheap-and-thorough one (it always thinks before it
  # answers); Beam Free is the free-and-unlimited one, and the only model in
  # the plan whose usage is "Unlimited" rather than a monthly dollar
  # allowance.
  muse-spark-1.3-contributor:           {provider: opencode, model: muse-spark-1.3-contributor}
  beam-free:                            {provider: opencode, model: beam-free}
  # Trae: the model id on the right is the registry name (Trae's `config_name`),
  # which is also what the adapter matches against its live catalogue.
  trae-deepseek-v4.1-flash:             {provider: trae, model: DeepSeek-V4.1-Flash}
  # qpcmqam relay: one model, so the alias is the only way to reach it.
  qpcmqam-gemini-4-argon:               {provider: qpcmqam, model: gemini-4-argon}

# ── Accounts: several logins for one provider ──────────────────────────
# Each extra account becomes its own LiteLLM deployment named
# `<model>-<suffix>`, with its own key env var. LiteLLM load-balances across
# deployments that share a model_name and cools one down when it answers 429,
# so a pool needs no router of its own — this table only says what the extra
# accounts are called and where their credentials live.
#
# Credentials go in ~/.config/litellm/proxy.env as `<auth_env>=<token>`
# (never in this file). Populate them with `ccp accounts add <provider> <suffix> --token …`.
#
# The bare model name always exists and always uses the provider's primary
# auth_env, so removing every account here restores the single-account
# behaviour with no other change.
accounts: {}
# Example — two logins for one provider behind a pool:
#   accounts:
#     cline:
#       a2: {auth_env: CLINE_API_KEY_2, label: "second account"}

# ── Routing groups: one name, several models ───────────────────────────
# A group is a LiteLLM model_name shared by several deployments. `members`
# are aliases or registry model ids; every member must be emitted, which
# `ccp render` takes care of. The group name is what you put in
# ANTHROPIC_MODEL (`ccp -m group/...`), and it fails over between members
# natively: a member answering 429 is cooled down and the next is tried.
#
#   routing_strategy: simple-shuffle (default) | least-busy |
#                     latency-based-routing | usage-based-routing-v2 |
#                     cost-based-routing
#   fallback: the name to fall back to once every member is exhausted.
#
# NOTE: LiteLLM allows a model in at most one group, so keep membership
# disjoint. A member that is also an alias keeps its own entry.
#
# `main` and `pro` retain their current DeepSeek route. `flash` is the
# text-only Beam fast route; keep it stable in the Qianfan window override too.
#
# The members are OpenDesign, with Cline as the stand-in. Qianfan is NOT in this
# block: its Token Plan is metered by wall-clock time — full price by day, 20%
# after 21:00 — so a failover that fires at midday bills five times what the
# same turn costs after dark. A fallback has to be safe to hit at any hour, and
# this one is not.
#
# Qianfan is instead swapped in by `scripts/qianfan_window.sh`, which runs from
# systemd timers at 21:00 and 08:00: it rewrites the `# >>> qianfan-window`
# block below and re-renders. Keeping that out of the committed defaults is the
# point — the file on disk must be the cheap one, and the expensive one exists
# only for the hours someone chose.
#
# A group is a curation choice, so it has to name models that still exist —
# `ccp render` reports an unresolvable member instead of emitting a deployment
# that 400s at request time.
groups:
  main:
    # >>> qianfan-window
    members:
    - opendesign-deepseek-v4.1-flash
    fallback:
    - qianfan-deepseek-v4.1-flash-1017
    # <<< qianfan-window
  pro:
    members:
    - qpcmqam-gemini-4-argon
    fallback:
    - opendesign-deepseek-v4.1-flash
  flash:
    members:
    - beam-free
# Example — cheap-first, escalating to a different vendor when both are out:
#   groups:
#     daily:
#       members: [qianfan-deepseek-v4.1-flash, cline-deepseek-v4.1-flash]
#       routing_strategy: usage-based-routing-v2
#       fallback: opendesign-deepseek-v4-pro

# ── Models that get individual LiteLLM entries (so `ccp -m <name>` works) ─
# Keep this list short: each entry becomes a selectable model name, and a raw
# upstream id is not something anyone can decode in a picker.

# ── Nothing is exposed by raw upstream id ─────────────────────────────
# `expose_models` used to list raw ids (e.g. `deepseek/deepseek-v4-pro`) so
# `ccp -m <id>` reached them. Every one of those is now an alias instead: a
# slash id is not something anyone can read in a picker, and the whole point of
# the alias table is that a selectable name says which model it is. Keep it that
# way — add an alias, not an exposure.
