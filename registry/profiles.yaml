# registry/profiles.yaml — the ONLY hand-authored curation layer.
#
# Everything factual about a model (context window, output cap, vision) is
# auto-discovered into registry/models.yaml by bridge/discover_models.py and
# must NOT be duplicated here. This file only records *choices*:
#   - which discovered model each Claude Code tier maps to, per profile
#   - the short alias the user types (ccp <alias>, /model tier)
#
# `ccp render` joins this with registry/models.yaml to emit:
#   ~/.config/litellm/config.yaml   (model_list + model_info)
#   bridge/clamp_map.json           (model -> max_output for the proxy)
#   providers/<profile>.json.example (CLAUDE_CODE_MAX_CONTEXT_TOKENS, tiers)
#
# Model names below are the *registry* names (upstream ids). Use the exact
# string shown by `ccp models <provider>`.

version: 1

# ── Provider entry points ──────────────────────────────────────────────
# An entry point = one Claude Code profile. `tiers` maps the four Claude Code
# slots to registry model names. `ctx_from` picks which tier's model defines
# CLAUDE_CODE_MAX_CONTEXT_TOKENS for the whole profile (Claude Code has one
# context number per session, so we advertise the slot the user starts on).
profiles:
  cmdc-deepseek:
    provider: cmdc
    primary_tier: sonnet
    tiers:
      default: {model: deepseek/deepseek-v4.1-flash}
      opus:    {model: deepseek/deepseek-v4-pro}
      fable:   {model: deepseek/deepseek-v4-pro}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash-fast}

  cmdc-deepseek-fast:
    provider: cmdc
    primary_tier: default
    tiers:
      default: {model: deepseek/deepseek-v4.1-flash-fast}
      opus:    {model: deepseek/deepseek-v4-pro}
      fable:   {model: deepseek/deepseek-v4-pro}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash-fast}

  cmdc-deepseek-pro:
    provider: cmdc
    primary_tier: opus
    tiers:
      default: {model: deepseek/deepseek-v4-pro}
      opus:    {model: deepseek/deepseek-v4-pro}
      fable:   {model: deepseek/deepseek-v4-pro}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash-fast}

  # Multimodal entry point: every tier points at a vision-capable model so
  # pasting an image "just works". Kept separate from the text profiles so
  # plain text turns stay on the cheaper/faster pure-text ladder.
  cmdc-vision:
    provider: cmdc
    primary_tier: opus
    tiers:
      default: {model: deepseek/deepseek-v4-flash-vision-exp}
      opus:    {model: deepseek/deepseek-v4-flash-vision-exp}
      fable:   {model: deepseek/deepseek-v4-flash-vision-exp}
      sonnet:  {model: deepseek/deepseek-v4-flash-vision-exp}
      haiku:   {model: deepseek/deepseek-v4.1-flash-fast}

  cline-deepseek:
    provider: cline
    primary_tier: default
    tiers:
      default: {model: deepseek/deepseek-v4.1-flash}
      opus:    {model: deepseek/deepseek-v4.1-flash}
      fable:   {model: deepseek/deepseek-v4.1-flash}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash}

  # ── Native Anthropic-compatible endpoints (no bridge clamp needed) ──
  # These talk straight to the provider's /anthropic endpoint; they are
  # rendered into config.yaml too so `ccp models` can list them, but the
  # profile JSON points ANTHROPIC_BASE_URL directly (no 127.0.0.1:4000).
  # Models are auto-discovered (see registry/models.yaml).
  deepseek:
    provider: deepseek
    native: true
    primary_tier: default
    tiers:
      default: {model: deepseek-flash}
      opus:    {model: deepseek-v4-pro}
      fable:   {model: deepseek-v4-pro}
      sonnet:  {model: deepseek-flash}
      haiku:   {model: deepseek-flash}

  minimax:
    provider: minimax
    native: true
    primary_tier: default
    tiers:
      default: {model: MiniMax-M3}
      opus:    {model: MiniMax-M3}
      sonnet:  {model: MiniMax-M3}
      haiku:   {model: MiniMax-M3}

  # ── OpenDesign (amr-link.open-design.ai) ──────────────────────────────
  # Anthropic-native aggregator, so `native: true` — no bridge, no rewrites,
  # the profile points straight at the endpoint. A cheap credit re-seller
  # ($8 buys ~$120 of list-price usage), which is why the ladder is built from
  # its own capability/cost metadata rather than from list price:
  #   default/sonnet : deepseek-v4.1-flash — marked advanced, cost low
  #   opus/fable     : deepseek-v4-pro     — the high/advanced rung
  #   haiku          : glm-5.3-flash       — low cost, still 1M and advanced
  # Everything here is 1M-context, so Claude Code keeps a 1M window on any tier.
  opendesign:
    provider: opendesign
    native: true
    primary_tier: default
    tiers:
      default: {model: deepseek-v4.1-flash}
      opus:    {model: deepseek-v4-pro}
      fable:   {model: deepseek-v4-pro}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: glm-5.3-flash}

  copilot:
    provider: copilot
    native: false
    primary_tier: sonnet
    tiers:
      default: {model: github_copilot/claude-sonnet-5.5}
      opus:    {model: github_copilot/claude-opus-5.5}
      fable:   {model: github_copilot/claude-opus-5.5}
      sonnet:  {model: github_copilot/claude-sonnet-5.5}
      haiku:   {model: github_copilot/claude-haiku-5.5}

  # ── CodeBuddy (Tencent coding-copilot subscription) ────────────────────
  # One entry point onto the CodeBuddy model fleet; the ladder mixes vendors
  # because no single vendor covers all four tiers well. Every model listed
  # here is 1M-context, so Claude Code's auto-compact window can stay at 1M
  # whichever tier is active (compaction itself runs on the haiku tier).
  #   default/sonnet : DeepSeek v4.1 Flash — free (0 credits), 1M, multimodal
  #   opus/fable     : GLM-5.3 — strongest tool-call reliability in the fleet
  #   haiku          : GLM-5.3-Flash — cheap, fast, still 1M
  # Switch within the provider with `ccp -m codebuddy-glm` etc. (see aliases).
  codebuddy:
    provider: codebuddy
    native: false
    primary_tier: default
    tiers:
      default: {model: deepseek-v4.1-flash}
      opus:    {model: glm-5.3}
      fable:   {model: glm-5.3}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: glm-5.3-flash}

# ── Providers not covered by auto-discovery ────────────────────────────
# Describes how to render their config entries + model metadata. Keyed by the
# `provider:` name used in `profiles:` above.
providers:
  copilot:
    endpoint_kind: github_copilot   # no api_base / api_key (token store)
    model_defaults:                 # substring match -> metadata
      claude-opus-5.5:  {ctx: 1000000, max_output: 32000, vision: true}
      claude-sonnet-5.5: {ctx: 1000000, max_output: 32000, vision: true}
      claude-haiku-5.5: {ctx: 1000000, max_output: 32000, vision: true}
      claude-opus-5:    {ctx: 200000, max_output: 32000, vision: true}
      claude-sonnet-5:  {ctx: 200000, max_output: 32000, vision: true}
      claude-opus-4.5:  {ctx: 200000, max_output: 32000, vision: true}
      claude-sonnet-4.5: {ctx: 200000, max_output: 32000, vision: true}
      claude-haiku-4.5: {ctx: 200000, max_output: 32000, vision: true}

# ── Short aliases exposed to LiteLLM (config.yaml model_name) ──────────
# These are the names Claude Code puts in ANTHROPIC_MODEL. The `[1m]` marker
# is appended automatically for models whose ctx >= 1000000 (the proxy strips
# it before forwarding). Add aliases here only when you want a friendly name;
# the profile tier model above already resolves via its registry name.
aliases:
  cmdc-deepseek:      {provider: cmdc, model: deepseek/deepseek-v4.1-flash, ctx: 1000000}
  cmdc-deepseek-fast: {provider: cmdc, model: deepseek/deepseek-v4.1-flash-fast, ctx: 1000000}
  cmdc-deepseek-pro:  {provider: cmdc, model: deepseek/deepseek-v4-pro, ctx: 1000000}
  cmdc-vision:        {provider: cmdc, model: deepseek/deepseek-v4-flash-vision-exp, ctx: 1000000}
  cline-deepseek:     {provider: cline, model: deepseek/deepseek-v4.1-flash, ctx: 1000000}
  # Copilot: keep the original short names so existing configs keep working
  claude-sonnet-5.5:  {provider: copilot, model: github_copilot/claude-sonnet-5.5, ctx: 1000000}
  claude-opus-5.5:    {provider: copilot, model: github_copilot/claude-opus-5.5, ctx: 1000000}
  claude-haiku-5.5:   {provider: copilot, model: github_copilot/claude-haiku-5.5, ctx: 1000000}
  # CodeBuddy: one alias per vendor worth hot-switching to via `ccp -m`
  codebuddy:          {provider: codebuddy, model: deepseek-v4.1-flash, ctx: 1000000}
  codebuddy-glm:      {provider: codebuddy, model: glm-5.3, ctx: 1000000}
  codebuddy-fast:     {provider: codebuddy, model: glm-5.3-flash, ctx: 1000000}
  codebuddy-kimi:     {provider: codebuddy, model: kimi-k3, ctx: 1000000}
  codebuddy-gpt:      {provider: codebuddy, model: gpt-5.5, ctx: 1000000}
  codebuddy-gemini:   {provider: codebuddy, model: gemini-3.5-flash, ctx: 1000000}
  codebuddy-hunyuan:  {provider: codebuddy, model: hy4-preview, ctx: 1000000}
  # OpenDesign: hot-swap between the aggregator's rungs with `ccp -m`
  opendesign:         {provider: opendesign, model: deepseek-v4.1-flash, ctx: 1048000}
  opendesign-pro:     {provider: opendesign, model: deepseek-v4-pro, ctx: 1048000}
  opendesign-glm:     {provider: opendesign, model: glm-5.3-flash, ctx: 1048000}
  opendesign-luna:    {provider: opendesign, model: gpt-6-luna, ctx: 1050000}
  opendesign-mimo:    {provider: opendesign, model: mimo-v2.6-pro, ctx: 1048000}

# ── Accounts: several logins for one provider ──────────────────────────
# Each extra account becomes its own LiteLLM deployment named
# `<model>-<suffix>`, with its own key env var. LiteLLM load-balances across
# deployments that share a model_name and cools one down when it answers 429,
# so a pool needs no router of its own — this table only says what the extra
# accounts are called and where their credentials live.
#
# Credentials go in ~/.config/litellm/proxy.env as `<auth_env>=<token>`
# (never in this file). Populate them with `ccp accounts add codebuddy <suffix>`,
# which imports the login exactly like `ccp auth codebuddy` does.
#
# The bare model name always exists and always uses the provider's primary
# auth_env, so removing every account here restores the single-account
# behaviour with no other change.
accounts: {}
# Example — two CodeBuddy logins behind one pool:
#   accounts:
#     codebuddy:
#       a2: {auth_env: CODEBUDDY_API_KEY_2, label: "second account"}

# ── Routing groups: one name, several models ───────────────────────────
# A group is a LiteLLM model_name shared by several deployments. `members`
# are aliases or registry model ids; every member must be emitted, which
# `ccp render` takes care of. The group name is what you put in
# ANTHROPIC_MODEL (`ccp -m group/...`), and it fails over between members
# natively: a member answering 429 is cooled down and the next is tried.
#
#   routing_strategy: simple-shuffle (default) | least-busy |
#                     latency-based-routing | usage-based-routing-v2 |
#                     cost-based-routing
#   fallback: the name to fall back to once every member is exhausted.
#
# NOTE: LiteLLM allows a model in at most one group, so keep membership
# disjoint. A member that is also an alias keeps its own entry.
groups: {}
# Example — cheap-first, escalating to a different vendor when both are out:
#   groups:
#     daily:
#       members: [codebuddy, codebuddy-fast, cmdc-deepseek-fast]
#       routing_strategy: usage-based-routing-v2
#       fallback: cmdc-deepseek-pro

# ── Per-provider request rewrites (bridge/sse_watchdog.py) ─────────────
# Expanded by `ccp render` into bridge/request_rules.json, which maps each rule
# onto the concrete model names the client sends. Keep the lists here — they
# are curation choices, not discovered facts.
#
#   sanitize_channel: satisfy the provider's client-identity check before
#     forwarding. CodeBuddy/WorkBuddy answer 400
#     {"code":11128,"msg":"Illegal API invocation from an unapproved channel"}
#     for two things Claude Code always sends: the `x-anthropic-billing-header`
#     system block, and Claude Code's own identity line when it opens the first
#     system message (the interactive TUI always does). One of the two has to be
#     removed and the other neutralised with a leading newline. Anthropic's own
#     API wants the header untouched, so this stays scoped to providers whose
#     gateway inspects it.
request_rules:
  sanitize_channel:
    - codebuddy

# ── Models that get individual LiteLLM entries (so `ccp -m <name>` works) ─
# Everything else is still reachable via the provider's `*`-less explicit
# fallback only through discovery docs; keep this list short and curated.
expose_models:
  - deepseek/deepseek-v4.1-flash
  - deepseek/deepseek-v4.1-flash-fast
  - deepseek/deepseek-v4-pro
  - deepseek/deepseek-v4-flash-vision-exp
  - moonshotai/Kimi-K3
  - zai-org/GLM-5.3
  - MiniMaxAI/MiniMax-M3
  - Qwen/Qwen3.8-Max
  - xai/grok-4.7
  - google/gemini-3.8-flash
  # CodeBuddy (unaliased picks)
  - gpt-5.6-sol
  - gpt-5.6-luna
  - kimi-k2.6
  - hy3
