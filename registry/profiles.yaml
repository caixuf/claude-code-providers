# registry/profiles.yaml — the ONLY hand-authored curation layer.
#
# Everything factual about a model (context window, output cap, vision) is
# auto-discovered into registry/models.yaml by bridge/discover_models.py and
# must NOT be duplicated here. This file only records *choices*:
#   - which discovered model each Claude Code tier maps to, per profile
#   - the short alias the user types (ccp <alias>, /model tier)
#
# `ccp render` joins this with registry/models.yaml to emit:
#   ~/.config/litellm/config.yaml   (model_list + model_info)
#   bridge/clamp_map.json           (model -> max_output for the proxy)
#   providers/<profile>.json.example (CLAUDE_CODE_MAX_CONTEXT_TOKENS, tiers)
#
# Model names below are the *registry* names (upstream ids). Use the exact
# string shown by `ccp models <provider>`.

version: 1

# ── Provider entry points ──────────────────────────────────────────────
# An entry point = one Claude Code profile. `tiers` maps the four Claude Code
# slots to registry model names. `ctx_from` picks which tier's model defines
# CLAUDE_CODE_MAX_CONTEXT_TOKENS for the whole profile (Claude Code has one
# context number per session, so we advertise the slot the user starts on).
profiles:
  cline-deepseek-v4.1-flash:
    provider: cline
    primary_tier: default
    tiers:
      default: {model: deepseek/deepseek-v4.1-flash}
      opus:    {model: deepseek/deepseek-v4.1-flash}
      fable:   {model: deepseek/deepseek-v4.1-flash}
      sonnet:  {model: deepseek/deepseek-v4.1-flash}
      haiku:   {model: deepseek/deepseek-v4.1-flash}

  # ── Native Anthropic-compatible endpoints (no bridge clamp needed) ──
  # These talk straight to the provider's /anthropic endpoint; they are
  # rendered into config.yaml too so `ccp models` can list them, but the
  # profile JSON points ANTHROPIC_BASE_URL directly (no 127.0.0.1:4000).
  # Models are auto-discovered (see registry/models.yaml).
  deepseek-v4.1-flash:
    provider: deepseek
    native: true
    primary_tier: default
    tiers:
      default: {model: deepseek-flash}
      opus:    {model: deepseek-v4-pro}
      fable:   {model: deepseek-v4-pro}
      sonnet:  {model: deepseek-flash}
      haiku:   {model: deepseek-flash}

  minimax-m3:
    provider: minimax
    native: true
    primary_tier: default
    tiers:
      default: {model: MiniMax-M3}
      opus:    {model: MiniMax-M3}
      sonnet:  {model: MiniMax-M3}
      haiku:   {model: MiniMax-M3}

  # ── OpenDesign (amr-link.open-design.ai) ──────────────────────────────
  # Anthropic-native aggregator, so `native: true` — no bridge, no rewrites,
  # the profile points straight at the endpoint. A cheap credit re-seller
  # ($8 buys ~$120 of list-price usage).
  #
  # Deliberately curated down to ONE model: every tier is deepseek-v4.1-flash,
  # so no Claude Code slot can drift onto a model this account was not meant to
  # spend on. It is 1048k-context, so the 1M window holds on every tier. Add a
  # rung here if that ever changes.
  opendesign-deepseek-v4.1-flash:
    provider: opendesign
    native: true
    primary_tier: default
    tiers:
      default: {model: deepseek-v4.1-flash}
      opus:    {model: deepseek-v4.1-flash}
      fable:   {model: deepseek-v4.1-flash}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: deepseek-v4.1-flash}

  # ── Trae CLI (ByteDance enterprise coding agent) ──────────────────────
  # Also `native: true`: bridge/trae_bridge.py speaks the Anthropic Messages
  # API directly, so Claude Code talks to :4100 with no LiteLLM hop. The
  # endpoint is the local adapter, not Trae itself — the adapter replays Trae's
  # private `llm_raw_chat` RPC using the PAT TraeCLI already stores on disk.
  #
  # Tiers are all VISION-capable on purpose. TraeCLI decides whether an image
  # reaches the model, and with a text-only model it substitutes
  # "[image/png content is not supported by current model]" — so a pasted
  # screenshot silently degrades on a text-only tier. glm-5.3 (the strongest
  # tool-caller on this subscription) is text-only, so it is reached via the
  # `trae-glm` alias instead of holding a tier.
  # Names are registry names (Trae `config_name`), which is what the adapter
  # matches against the live catalogue.
  trae-qwen3.8-max:
    provider: trae
    native: true
    primary_tier: sonnet
    tiers:
      default: {model: qwen3.8-max}
      opus:    {model: Doubao-Seed-2.1-pro}
      fable:   {model: Doubao-Seed-2.1-pro}
      sonnet:  {model: qwen3.8-max}
      haiku:   {model: glm-5.3-flash}

  # ── Baidu Qianfan (千帆) Token Plan, personal tier ─────────────────────
  # Standard OpenAI-compatible Chat Completions on a Token-Plan-specific
  # prefix, so this is a normal *bridged* provider: no adapter, no native
  # endpoint. No `ccp auth` step — the key lives in proxy.env.
  #
  # The plan only serves the GLM / DeepSeek families; discovery narrows the
  # 34-model catalogue down to the 6 ids this key can actually call.
  # deepseek-v4.1-flash takes the top tiers: 1.44M context and genuinely
  # multimodal (vision works on it), so it also backs image pasting.
  qianfan-deepseek-v4.1-flash:
    provider: qianfan
    primary_tier: sonnet
    tiers:
      default: {model: deepseek-v4.1-flash}
      opus:    {model: deepseek-v4-pro}
      fable:   {model: deepseek-v4-pro}
      sonnet:  {model: deepseek-v4.1-flash}
      haiku:   {model: glm-5.3-flash}

# ── Short aliases exposed to LiteLLM (config.yaml model_name) ──────────
# These are the names Claude Code puts in ANTHROPIC_MODEL. The `[1m]` marker
# is appended automatically for models whose ctx >= 1000000 (the proxy strips
# it before forwarding). Add aliases here only when you want a friendly name;
# the profile tier model above already resolves via its registry name.
aliases:
  # ── The names below are `<provider>-<exact model>` ─────────────────────
  # DeepSeek's version matters: v4.1-flash, v4-flash and v4-pro are three
  # different models, so no alias drops it. Same rule everywhere else — the
  # picker should never make you guess a version.
  cline-deepseek-v4.1-flash:            {provider: cline, model: deepseek/deepseek-v4.1-flash, ctx: 1000000}
  cline-deepseek-v4-pro:                {provider: cline, model: deepseek/deepseek-v4-pro, ctx: 1000000}
  # OpenDesign: hot-swap between the aggregator's rungs with `ccp -m`
  opendesign-deepseek-v4.1-flash:       {provider: opendesign, model: deepseek-v4.1-flash, ctx: 1048000}
  opendesign-deepseek-v4-pro:           {provider: opendesign, model: deepseek-v4-pro, ctx: 1048000}
  opendesign-glm-5.3-flash:             {provider: opendesign, model: glm-5.3-flash, ctx: 1048000}
  opendesign-gpt-6-luna:                {provider: opendesign, model: gpt-6-luna, ctx: 1050000}
  opendesign-mimo-v2.6-pro:             {provider: opendesign, model: mimo-v2.6-pro, ctx: 1048000}
  # Trae: the model id on the right is the registry name (Trae's `config_name`),
  # which is also what the adapter matches against its live catalogue.
  trae-glm-5.3:                         {provider: trae, model: glm-5.3, ctx: 168000}
  trae-glm-5.3-flash:                   {provider: trae, model: glm-5.3-flash, ctx: 168000}
  trae-deepseek-v4.1-flash:             {provider: trae, model: DeepSeek-V4.1-Flash, ctx: 168000}
  trae-deepseek-v4-pro:                 {provider: trae, model: deepseek-V4-Pro, ctx: 168000}
  trae-kimi-k3:                         {provider: trae, model: kimi-k3, ctx: 168000}
  trae-minimax-m3:                      {provider: trae, model: minimax-m3, ctx: 184000}
  trae-qwen3.8-max:                     {provider: trae, model: qwen3.8-max, ctx: 168000}
  trae-doubao-seed-2.1-pro:             {provider: trae, model: Doubao-Seed-2.1-pro, ctx: 184000}
  # Qianfan: bridged, so these resolve through LiteLLM like the cline alias.
  qianfan-deepseek-v4.1-flash:          {provider: qianfan, model: deepseek-v4.1-flash, ctx: 1441792}
  qianfan-deepseek-v4-pro:              {provider: qianfan, model: deepseek-v4-pro, ctx: 1441792}
  qianfan-deepseek-v4-flash:            {provider: qianfan, model: deepseek-v4-flash-0731, ctx: 1441792}
  qianfan-glm-5.3:                      {provider: qianfan, model: glm-5.3, ctx: 1179648}
  qianfan-glm-5.3-flash:                {provider: qianfan, model: glm-5.3-flash, ctx: 1179648}
  qianfan-glm-5.2:                      {provider: qianfan, model: glm-5.2, ctx: 1179648}

# ── Accounts: several logins for one provider ──────────────────────────
# Each extra account becomes its own LiteLLM deployment named
# `<model>-<suffix>`, with its own key env var. LiteLLM load-balances across
# deployments that share a model_name and cools one down when it answers 429,
# so a pool needs no router of its own — this table only says what the extra
# accounts are called and where their credentials live.
#
# Credentials go in ~/.config/litellm/proxy.env as `<auth_env>=<token>`
# (never in this file). Populate them with `ccp accounts add codebuddy <suffix>`,
# which imports the login exactly like `ccp auth codebuddy` does.
#
# The bare model name always exists and always uses the provider's primary
# auth_env, so removing every account here restores the single-account
# behaviour with no other change.
accounts: {}
# Example — two CodeBuddy logins behind one pool:
#   accounts:
#     codebuddy:
#       a2: {auth_env: CODEBUDDY_API_KEY_2, label: "second account"}

# ── Routing groups: one name, several models ───────────────────────────
# A group is a LiteLLM model_name shared by several deployments. `members`
# are aliases or registry model ids; every member must be emitted, which
# `ccp render` takes care of. The group name is what you put in
# ANTHROPIC_MODEL (`ccp -m group/...`), and it fails over between members
# natively: a member answering 429 is cooled down and the next is tried.
#
#   routing_strategy: simple-shuffle (default) | least-busy |
#                     latency-based-routing | usage-based-routing-v2 |
#                     cost-based-routing
#   fallback: the name to fall back to once every member is exhausted.
#
# NOTE: LiteLLM allows a model in at most one group, so keep membership
# disjoint. A member that is also an alias keeps its own entry.
groups:
  main:
    members:
    - qianfan-deepseek-v4.1-flash
    fallback:
    - opendesign-deepseek-v4.1-flash
  pro:
    members:
    - qianfan-deepseek-v4-pro
    fallback:
    - opendesign-deepseek-v4-pro
  flash:
    members:
    - qianfan-glm-5.3-flash
    fallback:
    - opendesign-glm-5.3-flash
# Example — cheap-first, escalating to a different vendor when both are out:
#   groups:
#     daily:
#       members: [codebuddy, codebuddy-fast, cmdc-deepseek-fast]
#       routing_strategy: usage-based-routing-v2
#       fallback: cmdc-deepseek-pro

# ── Per-provider request rewrites (bridge/sse_watchdog.py) ─────────────
# Expanded by `ccp render` into bridge/request_rules.json, which maps each rule
# onto the concrete model names the client sends. Keep the lists here — they
# are curation choices, not discovered facts.
#
#   sanitize_channel: satisfy the provider's client-identity check before
#     forwarding. CodeBuddy/WorkBuddy answer 400
#     {"code":11128,"msg":"Illegal API invocation from an unapproved channel"}
#     for two things Claude Code always sends: the `x-anthropic-billing-header`
#     system block, and Claude Code's own identity line when it opens the first
#     system message (the interactive TUI always does). One of the two has to be
#     removed and the other neutralised with a leading newline. Anthropic's own
#     API wants the header untouched, so this stays scoped to providers whose
#     gateway inspects it.
request_rules: {}
# The one rule this repo ever carried — codebuddy's `sanitize_channel` client
# check — went with the provider. See docs/archived-providers.md to restore it
# alongside codebuddy.

# ── Models that get individual LiteLLM entries (so `ccp -m <name>` works) ─
# Keep this list short: each entry becomes a selectable model name, and a raw
# upstream id is not something anyone can decode in a picker.

# ── Nothing is exposed by raw upstream id ─────────────────────────────
# `expose_models` used to list raw ids (e.g. `deepseek/deepseek-v4-pro`) so
# `ccp -m <id>` reached them. Every one of those is now an alias instead: a
# slash id is not something anyone can read in a picker, and the whole point of
# the alias table is that a selectable name says which model it is. Keep it that
# way — add an alias, not an exposure.
