  - name: opencode
    # Zen's free tier, reached through the local opencode server — see
    # bridge/opencode_bridge.py. `endpoint_kind: anthropic` because the adapter
    # speaks the Anthropic Messages API itself (native profile, no LiteLLM hop).
    #
    # ⚠️ The `ctx` values below are NOT opencode's published `limit.context`.
    # Those numbers are wrong in BOTH directions and were measured on
    # 2026-10-15 with a needle test (a six-digit number buried at the halfway
    # point of a long filler prompt; the model must read it back — a bare
    # "succeeded" answer proves nothing, because the upstream may silently
    # truncate and still answer the tail question correctly):
    #   cat-jam-free          advertises  262 144, read a needle at 1.15M 汉字
    #   longcat-2.5-preview   advertises 1 000 000  ✅ 1.15M
    #   step-5-preview        advertises 1 000 000  ❌ intermittent 503
    #   deepseek-v4.1-flash   advertises   200 000  ✅ 1.6M (needle at 50%)
    # So a published 200k does not mean 200k, and a published 1M does not mean
    # 1M. Re-run the needle probe rather than trusting either the catalogue or
    # these numbers when the tier changes.
    # The 503s are upstream load, not a window: the same size passes and fails
    # on consecutive attempts, so a single failure is not a ceiling.
    api_base: http://127.0.0.1:4110
    endpoint_kind: anthropic
    auth_env: OPENCODE_BRIDGE_TOKEN
    models:
      - name: deepseek-v4.1-flash-free
        # advertises 200k; needle verified at 1.6M 汉字, so 1M is the window
        # Claude Code is told about.
        ctx: 1048576
        max_output: 32000
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: longcat-2.5-preview-free
        # needle verified at 1.15M 汉字
        ctx: 1048576
        max_output: 131072
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: muse-spark-1.3-contributor-free
        # needle verified at 1.15M 汉字
        ctx: 1048576
        max_output: 131072
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: space-bunny-free
        # needle verified at 1.15M 汉字
        ctx: 1048576
        max_output: 524288
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: step-5-preview-free
        # Advertises 1M but 1.15M answered 503 twice, and even 400k came back
        # OK-then-503. Held to the size that answered reliably rather than to
        # the advertised number.
        ctx: 400000
        max_output: 65536
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: nemotron-3.5-lightning-free
        # Same story as step-5, and at 400k it once returned an EMPTY body with
        # HTTP 200 — a silent failure, which is worse than a 503 because the
        # agent sees a successful turn with nothing in it.
        ctx: 262144
        max_output: 262144
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: cat-jam-free
        # advertises 262k; needle verified at 1.15M 汉字
        ctx: 1048576
        max_output: 131072
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
      - name: mimo-v2.6-flash-free
        # advertises 200k; 400k passed twice, 1.15M returned 503 — kept at the
        # verified floor rather than the advertised ceiling.
        ctx: 400000
        max_output: 32000
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
  - name: agy
    # Google Antigravity CLI, driven through bridge/agy_bridge.py. `agy` here is
    # the WSL-native ELF binary at ~/.local/bin/agy; a Windows `agy.exe` also
    # exists under the user profile and is NOT interchangeable — it re-runs the
    # Google OAuth flow on every new process and floods the desktop with login
    # prompts. The bridge therefore takes an absolute path, never `PATH`, where
    # the Windows copy comes first.
    #
    # What this provider really is: a full agent, not a model endpoint. Its free
    # quota is metered against the CLI and the only surface exposed is its own
    # session protocol, so the adapter drives that rather than calling inference.
    #
    # ⚠️ `ctx` is measured, and it is much smaller than the models' real windows.
    # agy caps INPUT at roughly 63.5k tokens for gemini-3.8-flash-* and 72.9k for
    # claude-sonnet-4-6 — measured by watching `usage.input_tokens` plateau while
    # the prompt kept growing (100k and 300k 汉字 both reported ~63.3k). About
    # 13k of that cap is agy's own system prompt and tool definitions, so the
    # budget actually left for the caller is nearer 50k / 60k. Past the cap the
    # input is truncated *silently*: the turn still succeeds, the model just
    # answers without having seen everything. Advertising the model's true
    # window would walk Claude Code straight into that, so these are the usable
    # numbers, not the model's.
    #
    # An earlier note here claimed a ~60KB *byte* limit. That was wrong, and the
    # way it was wrong is worth keeping: the probe fed `"测" * 40000`, and
    # Gemini's safety filter rejects degenerate repeated text with
    # `status=SUCCESS, response=""` plus the real reason in `error`. The bridge
    # used to report every empty body as "empty completion", which turned a
    # content rejection into a phantom size limit. Realistic prose of the same
    # size always went through.
    api_base: http://127.0.0.1:4120
    endpoint_kind: anthropic
    auth_env: AGY_BRIDGE_TOKEN
    models:
      - name: claude-sonnet-4-6
        ctx: 60000
        max_output: 64000
        vision: false
        endpoint_kind: anthropic
        aliases: []
        tiers: []
