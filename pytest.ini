[pytest]
# Archived adapters keep their tests beside them (bridge/archived/tests), and
# those tests exercise providers that are no longer in the registry — they fail
# for reasons that have nothing to do with the shipped code, which is what made
# the suite red after the prune. Collected again automatically when a provider
# is restored, because restoring one moves its adapter and tests back under
# bridge/.
norecursedirs = archived
